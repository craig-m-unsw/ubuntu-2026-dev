---

# Ansible playbook to prep Ubuntu desktop
# https://docs.ansible.com/projects/ansible/latest/playbook_guide/playbooks_intro.html
#
# Run with: 
#
#   $ sudo ansible-playbook -i "localhost," -c local playbook.yml -e prime_user=sysadmin

- hosts: localhost
  connection: local
  become: true
  gather_facts: true

  #####
  vars:
  #####

    # prime user with sudo
    prime_user_home: "/home/{{ prime_user }}"
    sudo_audit_user: "{{ prime_user }}"
    sudo_iolog_dir: /var/log/sudo-io

    # apt packages from default Ubuntu software repositories
    packages_install:
      - git
      - tig
      - build-essential
      - jq
      - bats
      - dos2unix
      - make
      - gnupg
      - mokutil
      - inotify-tools
      - nmap
      - gpg
      - uuid
      - tcpdump
      - wireshark
      - socat
      - iotop
      - htop
      - tree
      - tmux
      - sqlite-utils
      - bc
      - mc
      - vim
      - nano
      - apt-transport-https
      - software-properties-common
      - curl
      - bzip2
      - wget
      - unzip
      - zip
      - whois
      - rsync
      - expect
      - dnsutils
      - qemu-system
      - libvirt-daemon-system
      - libvirt-clients
      - bridge-utils
      - virt-manager
      - python3-venv
      - python3 
      - python3-pip
      - bubblewrap
      - apparmor 
      - apparmor-utils
      - auditd
      - openscap-scanner
      - openscap-common

    hashicorp_packages:
      - packer
      - vagrant
      - vault
      - terraform
    microsoft_packages:
      - code
      - gh
    nodejs_major_version: "22.x"
    nodejs_packages:
      - nodejs
    docker_packages:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin

    create_folders:
      - dir: /etc/opt/keyrings
        mode: '0755'
        owner: root
        group: root
      - dir: /etc/ansible/facts.d/
        mode: '0755'
        owner: root
        group: root
      - dir: /opt/linuxmoe/
        mode: '0755'
        owner: root
        group: root
      - dir: /opt/linuxmoe/downloads/
        mode: '0755'
        owner: root
        group: root
      - dir: /opt/linuxmoe/docs/
        mode: '0755'
        owner: root
        group: root

  ######
  tasks:
  ######

    - name: Validate host environment
      block:
        - name: Check required variables
          ansible.builtin.assert:
            that:
              - create_folders is defined
              - packages_install is defined
              - prime_user is defined
              - prime_user | length > 0
            fail_msg: "Required node variables are not defined"
    - name: Ensure base directories exist
      ansible.builtin.file:
        path: "{{ item.dir }}"
        state: directory
        mode: "{{ item.mode }}"
        owner: "{{ item.owner }}"
        group: "{{ item.group }}"
      loop: "{{ create_folders }}"

    # Software setup (base Ubuntu OS)
    - name: Software internal Ubuntu repo
      tags: [software]
      block:
        - name: Update apt cache (if needed)
          ansible.builtin.apt:
            update_cache: true
            cache_valid_time: 3600
        - name: Ensure required packages are installed
          ansible.builtin.apt:
            name: "{{ packages_install }}"
            state: present
          register: install_result
          retries: 3
          delay: 5
          until: install_result is succeeded
        - name: Ensure SSHD is installed but not started
          block:
            - name: Install OpenSSH server without starting it
              ansible.builtin.apt:
                name: openssh-server
                state: present
                policy_rc_d: 101
            - name: Ensure SSHD is stopped and disabled
              ansible.builtin.service:
                name: ssh
                state: stopped
                enabled: false

    # Software external resources
    # Enable/Disable this in /etc/ansible/facts.d/aainstall.fact
    - name: Setup external software repositories
      tags: [software]
      when: ansible_local.aainstall.ff_extrepo_enabled | bool
      block:
        - name: Setup HashiCorp repository
          block:
            - name: Install HashiCorp repository signing key
              ansible.builtin.get_url:
                url: https://apt.releases.hashicorp.com/gpg
                dest: /etc/opt/keyrings/hashicorp.asc
                checksum: sha256:cafb01beac341bf2a9ba89793e6dd2468110291adfbb6c62ed11a0cde6c09029
                mode: '0644'
            - name: Add HashiCorp repository
              ansible.builtin.apt_repository:
                repo: "deb [signed-by=/etc/opt/keyrings/hashicorp.asc] https://apt.releases.hashicorp.com resolute main"
                filename: hashicorp
                state: present
                update_cache: false
            - name: Update apt cache for HashiCorp repository
              ansible.builtin.apt:
                update_cache: true
            - name: Install HashiCorp packages
              ansible.builtin.apt:
                name: "{{ hashicorp_packages }}"
                state: present
              register: hashicorp_install_result
              retries: 3
              delay: 5
              until: hashicorp_install_result is succeeded
        - name: Setup Microsoft repositories
          block:
            - name: Download Microsoft repository config package
              ansible.builtin.get_url:
                url: https://packages.microsoft.com/config/ubuntu/26.04/packages-microsoft-prod.deb
                dest: /opt/linuxmoe/downloads/packages-microsoft-prod.deb
                mode: '0644'
            - name: Install Microsoft repository config package
              ansible.builtin.apt:
                deb: /opt/linuxmoe/downloads/packages-microsoft-prod.deb
            - name: Install Visual Studio Code repository signing key
              ansible.builtin.get_url:
                url: https://packages.microsoft.com/keys/microsoft.asc
                dest: /etc/opt/keyrings/microsoft.asc
                checksum: sha256:2fa9c05d591a1582a9aba276272478c262e95ad00acf60eaee1644d93941e3c6
                mode: '0644'
              register: vscode_key_download
            - name: Check Visual Studio Code keyring
              ansible.builtin.stat:
                path: /etc/opt/keyrings/microsoft-vscode.gpg
              register: vscode_keyring
            - name: Convert Visual Studio Code signing key to gpg keyring
              ansible.builtin.command:
                argv:
                  - gpg
                  - --dearmor
                  - --batch
                  - --yes
                  - --output
                  - /etc/opt/keyrings/microsoft-vscode.gpg
                  - /etc/opt/keyrings/microsoft.asc
              when: vscode_key_download is changed or not vscode_keyring.stat.exists
            - name: Ensure Visual Studio Code keyring permissions
              ansible.builtin.file:
                path: /etc/opt/keyrings/microsoft-vscode.gpg
                mode: '0644'
                owner: root
                group: root
                state: file
            - name: Add Visual Studio Code repository
              ansible.builtin.apt_repository:
                repo: "deb [arch=amd64 signed-by=/etc/opt/keyrings/microsoft-vscode.gpg] https://packages.microsoft.com/repos/code stable main"
                filename: vscode
                state: present
                update_cache: false
            - name: Install GitHub CLI repository signing key
              ansible.builtin.get_url:
                url: https://cli.github.com/packages/githubcli-archive-keyring.gpg
                dest: /etc/opt/keyrings/githubcli-archive-keyring.gpg
                checksum: sha256:6084d5d7bd8e288441e0e94fc6275570895da18e6751f70f057485dc2d1a811b
                mode: '0644'
            - name: Add GitHub CLI repository
              ansible.builtin.apt_repository:
                repo: "deb [arch=amd64 signed-by=/etc/opt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main"
                filename: github-cli
                state: present
                update_cache: false
            - name: Update apt cache for Microsoft repositories
              ansible.builtin.apt:
                update_cache: true
            - name: Install Microsoft repository packages
              ansible.builtin.apt:
                name: "{{ microsoft_packages }}"
                state: present
              register: microsoft_install_result
              retries: 3
              delay: 5
              until: microsoft_install_result is succeeded
        - name: Setup NodeSource repository
          block:
            - name: Install NodeSource repository signing key
              ansible.builtin.get_url:
                url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
                dest: /etc/opt/keyrings/nodesource-repo.gpg.key
                checksum: sha256:b42e0321dabdc24e892115da705cf061167eac12a317f23d329862d0aa0a271d
                mode: '0644'
              register: nodesource_key_download
            - name: Check NodeSource keyring
              ansible.builtin.stat:
                path: /etc/opt/keyrings/nodesource.gpg
              register: nodesource_keyring
            - name: Convert NodeSource signing key to gpg keyring
              ansible.builtin.command:
                argv:
                  - gpg
                  - --dearmor
                  - --batch
                  - --yes
                  - --output
                  - /etc/opt/keyrings/nodesource.gpg
                  - /etc/opt/keyrings/nodesource-repo.gpg.key
              when: nodesource_key_download is changed or not nodesource_keyring.stat.exists
            - name: Ensure NodeSource keyring permissions
              ansible.builtin.file:
                path: /etc/opt/keyrings/nodesource.gpg
                mode: '0644'
                owner: root
                group: root
                state: file
            - name: Add NodeSource repository
              ansible.builtin.apt_repository:
                repo: "deb [arch=amd64 signed-by=/etc/opt/keyrings/nodesource.gpg] https://deb.nodesource.com/node_{{ nodejs_major_version }} nodistro main"
                filename: nodesource
                state: present
                update_cache: false
            - name: Update apt cache for NodeSource repository
              ansible.builtin.apt:
                update_cache: true
            - name: Install Node.js packages
              ansible.builtin.apt:
                name: "{{ nodejs_packages }}"
                state: present
              register: nodejs_install_result
              retries: 3
              delay: 5
              until: nodejs_install_result is succeeded
        - name: Setup Docker repository
          block:
            - name: Install Docker repository signing key
              ansible.builtin.get_url:
                url: https://download.docker.com/linux/ubuntu/gpg
                dest: /etc/opt/keyrings/docker.asc
                checksum: sha256:1500c1f56fa9e26b9b8f42452a553675796ade0807cdce11975eb98170b3a570
                mode: '0644'
            - name: Add Docker repository
              ansible.builtin.apt_repository:
                repo: "deb [arch=amd64 signed-by=/etc/opt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu resolute stable"
                filename: docker
                state: present
                update_cache: false
            - name: Update apt cache for Docker repository
              ansible.builtin.apt:
                update_cache: true
            - name: Install Docker packages
              ansible.builtin.apt:
                name: "{{ docker_packages }}"
                state: present
              register: docker_install_result
              retries: 3
              delay: 5
              until: docker_install_result is succeeded

    - name: Configure system
      block:
        - name: Harden /proc mount options in /etc/fstab
          ansible.builtin.lineinfile:
            path: /etc/fstab
            regexp: '^proc\s+/proc\s+proc\s+'
            line: 'proc    /proc    proc    defaults,nosuid,nodev,noexec,relatime,hidepid=2     0     0'
            state: present
            backup: true
        - name: Configure Git
          block:
            - name: Configure Git identities
              ansible.builtin.command:
                argv:
                  - git
                  - config
                  - --global
                  - "{{ item.key }}"
                  - "{{ item.value }}"
              become_user: "{{ item.user }}"
              environment:
                HOME: "{{ item.home }}"
              loop:
                - user: root
                  home: /root
                  key: user.name
                  value: root
                - user: root
                  home: /root
                  key: user.email
                  value: root@localhost
                - user: "{{ prime_user }}"
                  home: "{{ prime_user_home }}"
                  key: user.name
                  value: "{{ prime_user }}"
                - user: "{{ prime_user }}"
                  home: "{{ prime_user_home }}"
                  key: user.email
                  value: "{{ prime_user }}@localhost"
              changed_when: false
            - name: Generate SSH keys
              ansible.builtin.user:
                name: "{{ item }}"
                generate_ssh_key: true
                ssh_key_type: ed25519
                ssh_key_file: .ssh/id_ed25519
              loop:
                - root
                - "{{ prime_user }}"
        - name: Ensure Docker group exists
          ansible.builtin.group:
            name: docker
            state: present
        - name: Add devops user to Docker group
          ansible.builtin.user:
            name: "{{ prime_user }}"
            groups: docker
            append: true
        - name: Add devops user to KVM and libvirt groups
          ansible.builtin.user:
            name: "{{ prime_user }}"
            groups:
              - kvm
              - libvirt
            append: true

    - name: finish off
      block:
        - name: Update all apt packages
          ansible.builtin.apt:
            update_cache: true
            upgrade: dist
        - name: Refresh snaps
          ansible.builtin.command: snap refresh
        - name: Ensure sudo I/O log directory exists
          ansible.builtin.file:
            path: "{{ sudo_iolog_dir }}"
            state: directory
            owner: root
            group: root
            mode: '0700'
        - name: Enable sudo audit logging for the development account
          ansible.builtin.copy:
            dest: /etc/sudoers.d/90-development-sudo-audit
            owner: root
            group: root
            mode: '0440'
            validate: /usr/sbin/visudo -cf %s
            content: |
              # Managed by Ansible — do not edit.
              # Run sudo commands through a pseudo-terminal so terminal activity can be recorded consistently.
              Defaults:{{ sudo_audit_user }} use_pty
              # Capture command output to preserve what privileged commands returned.
              Defaults:{{ sudo_audit_user }} log_output
              # Capture terminal and piped input for complete replay; it may include passwords, API tokens, and secrets.
              Defaults:{{ sudo_audit_user }} log_input
              # Record each sudo command's exit status for troubleshooting and audit trails.
              Defaults:{{ sudo_audit_user }} log_exit_status
              # Store the per-session I/O logs in the managed local audit directory.
              Defaults:{{ sudo_audit_user }} iolog_dir="{{ sudo_iolog_dir }}"
        - name: finished
          copy:
            dest: /etc/opt/installed.txt
            owner: root
            group: root
            mode: '0644'
            content: |
              Installed successfully using:
              * Ubuntu Autoinstall
              * Cloud-Init
              * Ansible
